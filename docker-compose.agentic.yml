# Run together with the existing stack:
# docker compose -f docker-compose.yml -f docker-compose.agentic.yml up --build
services:
  agent:
    build: ./apps/agent
    environment:
      AGENT_PORT: "8090"
      HRIS_API_URL: http://api:8080
      AGENT_DATABASE_URL: postgres://hris:hris@postgres:5432/hris?sslmode=disable
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY to enable the HR agent}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    depends_on:
      api:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/hris-agent", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
  web:
    environment:
      AGENT_INTERNAL_URL: http://agent:8090
    depends_on:
      agent:
        condition: service_healthy
